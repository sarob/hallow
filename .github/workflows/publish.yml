# Publishes hallow with PyPI Trusted Publishing (OIDC); no API token is stored.
#
#   a published GitHub release -> build, then upload to pypi.org
#   a manual run of this workflow -> build, then upload to test.pypi.org
#
# One-time setup before the first run:
#   1. On pypi.org and on test.pypi.org (separate accounts), on the account's
#      Publishing page (/manage/account/publishing/), add a pending publisher
#      for GitHub: project `hallow`, owner `sarob`, repository `hallow`,
#      workflow `publish.yml`, environment `pypi` on pypi.org and `testpypi`
#      on test.pypi.org.
#   2. In this repository, under Settings > Environments, create the
#      environments `pypi` and `testpypi`.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Runs for the same ref queue up; an upload in progress is never cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Release tag equals the version in pyproject.toml
        # Tags are bare versions (`0.2.0`, no `v` prefix).
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c '
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          ')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::release tag '$TAG' does not match version '$version' in pyproject.toml"
            exit 1
          fi
      - name: Install build and twine
        run: python -m pip install build twine
      - name: Build the sdist and the wheel
        run: python -m build
      - name: twine check
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hallow
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    # A dry run of the release path; never triggered by a release.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hallow
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
